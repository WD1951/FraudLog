<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudLock Delivery — Certificação</title>

<style>
body {
  background: linear-gradient(180deg,#020617,#0f172a);
  color:#fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin:0;
  padding:16px;
}

.container { max-width:420px; margin:auto; }

.header {
  text-align:center;
  margin-bottom:20px;
}
.header h1 { color:#60a5fa; margin:0; }
.header p { color:#94a3b8; font-size:0.9rem; }

.card {
  background:#1e293b;
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input {
  width:100%;
  padding:14px;
  margin-top:6px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #334155;
  background:#020617;
  color:#fff;
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:10px;
  cursor:pointer;
}

.primary { background:#2563eb; }
.success { background:#059669; }
.danger { background:#dc2626; }
.gray { background:#475569; }

.hidden { display:none; }

.info {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #334155;
  font-size:0.9rem;
}

.hash {
  font-family:monospace;
  font-size:0.75rem;
  word-break:break-all;
  background:#020617;
  padding:10px;
  border-radius:8px;
  border:1px solid #334155;
  color:#60a5fa;
}

.status {
  color:#10b981;
  font-weight:bold;
}

.loader {
  text-align:center;
  padding:20px;
}

.qr {
  background:#fff;
  height:120px;
  border-radius:8px;
  margin:10px auto;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🛡️ FraudLock</h1>
<p>Certificação antifraude de entregas</p>
</div>

<!-- LOGIN -->
<div id="login">
<div class="card">
<label>CPF</label>
<input id="cpf">

<label>Celular</label>
<input id="celular">

<button class="primary" onclick="login()">Entrar com Sessão Segura</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="card">
<div class="info"><span>Status</span><span class="status">Proteção Ativa</span></div>
<div class="info"><span>Entregador</span><span id="nome"></span></div>
</div>

<button class="success" onclick="novaEntrega()">🚀 Iniciar Entrega</button>
<button class="danger" onclick="logout()">Sair</button>
</div>

<!-- ENTREGA -->
<div id="entrega" class="hidden">
<div class="card">
<div class="info"><span>Pedido</span><span id="pedido"></span></div>
<div class="info"><span>Local</span><span id="gps"></span></div>
<div class="info"><span>Hora</span><span id="hora"></span></div>
</div>

<button class="primary" onclick="validar()">🛡️ Validar Entrega</button>
<button class="gray" onclick="voltar()">Voltar</button>
</div>

<!-- PROCESSANDO -->
<div id="processando" class="hidden">
<div class="card loader">
<h3>Validando integridade...</h3>
<p>Gerando evidência criptográfica</p>
</div>
</div>

<!-- CERTIFICADO -->
<div id="certificado" class="hidden">

<div class="card">
<h3 style="text-align:center;">Entrega Certificada</h3>

<div class="info"><span>Pedido</span><span id="c-pedido"></span></div>
<div class="info"><span>GPS</span><span id="c-gps"></span></div>
<div class="info"><span>Hora</span><span id="c-hora"></span></div>
<div class="info"><span>Status</span><span class="status">Auditável</span></div>

</div>

<div class="card">
<div class="qr"></div>
<div class="hash" id="hash"></div>
</div>

<button class="primary" onclick="copiar()">📤 Compartilhar</button>
<button class="success" onclick="novaEntrega()">Nova Entrega</button>

</div>

</div>

<script>

let entrega = {}

function mostrar(id){
document.querySelectorAll('.container > div').forEach(d=>d.classList.add('hidden'))
document.getElementById(id).classList.remove('hidden')
}

function login(){
let cpf = document.getElementById('cpf').value
if(cpf.length<3){ alert("CPF inválido"); return }

document.getElementById('nome').innerText = "ID-"+cpf.slice(0,3)
mostrar('dashboard')
}

function novaEntrega(){
entrega = {
pedido: "FL-"+Math.floor(Math.random()*90000),
gps: gerarGPS(),
hora: new Date().toLocaleTimeString()
}

document.getElementById('pedido').innerText = entrega.pedido
document.getElementById('gps').innerText = entrega.gps
document.getElementById('hora').innerText = entrega.hora

mostrar('entrega')
}

function validar(){
mostrar('processando')

setTimeout(()=>{
gerarCertificado()
},2000)
}

function gerarCertificado(){

let hash = gerarHash()

document.getElementById('c-pedido').innerText = entrega.pedido
document.getElementById('c-gps').innerText = entrega.gps
document.getElementById('c-hora').innerText = entrega.hora
document.getElementById('hash').innerText = hash

mostrar('certificado')
}

function gerarHash(){
let chars='abcdef0123456789'
let h='FLX-'
for(let i=0;i<40;i++) h+=chars[Math.floor(Math.random()*chars.length)]
return h
}

function gerarGPS(){
let lat = (-23.55 - Math.random()/100).toFixed(5)
let lng = (-46.63 - Math.random()/100).toFixed(5)
return lat+", "+lng
}

function copiar(){
let txt = document.getElementById('hash').innerText
navigator.clipboard.writeText(txt)
alert("Certificado copiado")
}

function voltar(){ mostrar('dashboard') }
function logout(){ mostrar('login') }

</script>

</body>
</html>

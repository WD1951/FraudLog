<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FraudLog</title>
  <style>
    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    h1 {
      color: #4ecca3;
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #cccccc;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #4ecca3;
      border-radius: 8px;
      background: #16213e;
      color: #ffffff;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #0f3460;
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background: #3db892;
    }
    .hidden {
      display: none;
    }
    .card {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ FraudLog</h1>
    
    <!-- TELA DE LOGIN -->
    <div id="tela-login">
      <div class="card">
        <div class="form-group">
          <label>CPF (11 números)</label>
          <input type="text" id="cpf" placeholder="00000000000" maxlength="11" inputmode="numeric">
        </div>
        <div class="form-group">
          <label>Celular (11 números)</label>
          <input type="tel" id="celular" placeholder="11999999999" maxlength="11" inputmode="numeric">
        </div>
        <button onclick="fazerLogin()">ENTRAR</button>
      </div>
    </div>

    <!-- TELA DASHBOARD -->
    <div id="tela-dashboard" class="hidden">
      <div class="card">
        <h2 style="color: #4ecca3;">Bem-vindo!</h2>
        <p>App ativo — proteção ligada ✓</p>
      </div>
      <button onclick="iniciarEntrega()">🚀 Nova Entrega</button>
      <button onclick="fazerLogout()" style="background: #e94560; margin-top: 10px;">Sair</button>
    </div>

    <!-- TELA ENTREGA -->
    <div id="tela-entrega" class="hidden">
      <div class="card">
        <h2>Entrega em Andamento</h2>
        <p id="info-entrega">Carregando...</p>
      </div>
      <button onclick="gerarCertificado()">🛡️ Gerar Certificado</button>
      <button onclick="voltarDashboard()" style="background: #666; margin-top: 10px;">Voltar</button>
    </div>

    <!-- TELA CERTIFICADO -->
    <div id="tela-certificado" class="hidden">
      <div class="card">
        <h2 style="color: #4ecca3;">✓ Certificada!</h2>
        <p>Hash:</p>
        <p id="hash-resultado" style="word-break: break-all; font-size: 12px; background: #1a1a2e; padding: 10px; border-radius: 4px;"></p>
      </div>
      <button onclick="novaEntrega()">🔄 Nova Entrega</button>
      <button onclick="voltarDashboard()" style="background: #666; margin-top: 10px;">Voltar</button>
    </div>
  </div>

  <script>
    function fazerLogin() {
      var cpf = document.getElementById('cpf').value;
      var celular = document.getElementById('celular').value;
      if (cpf.length < 3 || celular.length < 3) {
        alert('Digite CPF e Celular válidos');
        return;
      }
      document.getElementById('tela-login').classList.add('hidden');
      document.getElementById('tela-dashboard').classList.remove('hidden');
    }

    function iniciarEntrega() {
      document.getElementById('info-entrega').innerText = 'Pedido #' + Math.floor(Math.random() * 90000 + 10000);
      document.getElementById('tela-dashboard').classList.add('hidden');
      document.getElementById('tela-entrega').classList.remove('hidden');
    }

    function gerarCertificado() {
      var hash = 'FL-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
      document.getElementById('hash-resultado').innerText = hash;
      document.getElementById('tela-entrega').classList.add('hidden');
      document.getElementById('tela-certificado').classList.remove('hidden');
    }

    function novaEntrega() {
      document.getElementById('tela-certificado').classList.add('hidden');
      document.getElementById('tela-entrega').classList.remove('hidden');
    }

    function voltarDashboard() {
      document.getElementById('tela-entrega').classList.add('hidden');
      document.getElementById('tela-certificado').classList.add('hidden');
      document.getElementById('tela-dashboard').classList.remove('hidden');
    }

    function fazerLogout() {
      document.getElementById('cpf').value = '';
      document.getElementById('celular').value = '';
      document.getElementById('tela-dashboard').classList.add('hidden');
      document.getElementById('tela-login').classList.remove('hidden');
    }
  </script>
</body>
</html>

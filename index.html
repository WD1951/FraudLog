<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FraudLog App — Operação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 180px; border-radius: 12px; border: 2px solid #00C896; }
        .step-box { border-left: 4px solid #00C896; background: #fff; padding: 15px; border-radius: 0 12px 12px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="max-w-[400px] mx-auto min-h-screen flex flex-col bg-white border-x border-slate-100">
        
        <header class="p-6 text-center border-b border-slate-50">
            <div class="w-14 h-14 border-2 border-[#00C896] rounded-2xl mx-auto flex items-center justify-center mb-1">
                <span class="text-2xl">🛡️</span>
            </div>
            <h1 class="text-xl font-black italic">Fraud<span class="text-[#00C896]">Log</span></h1>
            <p class="text-[9px] tracking-[0.2em] text-slate-400 font-bold uppercase">Sovereign Certification</p>
        </header>

        <main class="p-5 space-y-4 flex-grow">
            
            <div class="step-box space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-[11px] font-black uppercase text-emerald-700">1. Chegada ao Local (GPS)</h2>
                    <span id="status-gps" class="text-[9px] font-bold text-emerald-600 animate-pulse">● SINAL ATIVO</span>
                </div>
                <div id="map"></div>
                <p id="coords" class="text-[10px] font-mono text-slate-400 text-center">-23.5615, -46.6553</p>
            </div>

            <div class="step-box space-y-3">
                <h2 class="text-[11px] font-black uppercase text-slate-500">2. Prova de Imagem (PRNU)</h2>
                <button onclick="document.getElementById('file-input').click()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2">
                    📸 Fotografar Encomenda
                </button>
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <p class="text-[9px] text-slate-400 italic text-center">Captura metadados para perícia forense digital.</p>
            </div>

            <div class="step-box space-y-3 bg-emerald-50/30">
                <h2 class="text-[11px] font-black uppercase text-emerald-800">3. Confirmação do Recebimento</h2>
                <label class="flex items-center gap-3 p-3 bg-white border border-emerald-100 rounded-lg cursor-pointer">
                    <input type="checkbox" id="ok-recebido" class="w-5 h-5 accent-emerald-500">
                    <span class="text-xs font-bold text-emerald-900 leading-tight">Porteiro/Consumidor deu o OK via WhatsApp</span>
                </label>
            </div>

            <button onclick="gerarProtocolo()" class="w-full bg-[#00C896] text-[#0A0F1E] py-5 rounded-2xl font-black text-lg uppercase shadow-xl active:scale-95 transition-all">
                Certificar e Enviar Cópia
            </button>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-slate-900/90 z-[2000] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-3xl p-8 space-y-5 text-center shadow-2xl">
            <div class="text-4xl">📄</div>
            <h3 class="text-xl font-black">Entrega Certificada</h3>
            <div id="relatorio-texto" class="text-left text-[10px] font-mono p-4 bg-slate-50 rounded-xl border border-slate-200 leading-relaxed">
                </div>
            <p class="text-[10px] text-slate-500">Relatório enviado para a Cooperativa e Marketplace.</p>
            <button onclick="location.reload()" class="w-full py-4 bg-emerald-500 text-white rounded-xl font-black uppercase">Nova Entrega</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa Claro
        const map = L.map('map', {zoomControl:false}).setView([-23.5615, -46.6553], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([-23.5615, -46.6553]).addTo(map);

        function gerarProtocolo() {
            if(!document.getElementById('ok-recebido').checked) {
                alert("Aguarde o OK do porteiro/consumidor para certificar.");
                return;
            }
            const agora = new Date();
            const h = "FL-" + Math.random().toString(36).toUpperCase().substring(2,12);
            
            document.getElementById('relatorio-texto').innerHTML = `
                <strong>PROTOCOLO:</strong> ${h}<br>
                <strong>HORA DO OK:</strong> ${agora.toLocaleTimeString()}<br>
                <strong>COORDENADAS:</strong> -23.5615, -46.6553<br>
                <strong>SENSOR PRNU:</strong> OK (AUTENTICADO)<br>
                <strong>STATUS:</strong> CÓPIA ENVIADA AO MARKETPLACE
            `;
            document.getElementById('modal').classList.remove('hidden');
        }
    </script>
</body>
</html>

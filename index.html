<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FraudLog — Protocolo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --brand: #00C896; --dark: #0A0F1E; }
        body { background-color: var(--dark); color: white; font-family: sans-serif; }
        #map { height: 200px; border-radius: 1rem; border: 1px solid var(--brand); }
        .input-white { background: white; color: #0A0F1E; font-weight: bold; }
    </style>
</head>
<body>
    <div class="max-w-[400px] mx-auto min-h-screen p-6 flex flex-col gap-6">
        <header class="text-center py-4">
            <div class="w-16 h-16 border-2 border-[#00C896] rounded-2xl mx-auto flex items-center justify-center mb-2">
                <span class="text-2xl">🛡️</span>
            </div>
            <h1 class="text-2xl font-black">Fraud<span class="text-[#00C896]">Log</span></h1>
            <p class="text-[9px] tracking-[0.3em] text-gray-500 uppercase font-bold">Sovereign Certification</p>
        </header>

        <div class="space-y-4">
            <input type="tel" id="cpf" placeholder="CPF do Entregador" class="input-white w-full p-4 rounded-xl outline-none">
            <input type="tel" id="cel" placeholder="Celular / WhatsApp" class="input-white w-full p-4 rounded-xl outline-none">
        </div>

        <div id="map"></div>

        <label class="flex items-start gap-3 bg-white/5 p-4 rounded-xl border border-[#00C896]/30">
            <input type="checkbox" id="aceite" class="mt-1 w-5 h-5">
            <span class="text-[10px] leading-tight uppercase font-bold text-gray-300">Certifico o recebimento e autorizo registro de coordenadas FraudLog.</span>
        </label>

        <button onclick="gerar()" class="w-full bg-[#00C896] text-[#0A0F1E] py-5 rounded-xl font-black text-lg uppercase shadow-lg shadow-[#00C896]/20">
            Gerar Certificado
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl:false}).setView([-23.56, -46.65], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        function gerar() {
            if(!document.getElementById('cpf').value || !document.getElementById('aceite').checked) {
                alert("Preencha o CPF e o Aceite."); return;
            }
            alert("Certificado Gerado com Sucesso! Protocolo: FL-" + Math.random().toString(36).toUpperCase().substring(2,12));
        }
    </script>
</body>
</html>

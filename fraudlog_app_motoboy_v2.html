<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudLog — Entregador</title>

<style>
:root{
  --bg:#0A0F1E;
  --bg2:#111827;
  --bg3:#1A2235;
  --teal:#00C896;
  --gray:#8A9AB8;
  --white:#F0F6FF;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system, sans-serif;
  max-width:430px;
  margin:auto;
}

/* telas */
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

.center{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;}

.logo{
  font-size:30px;
  font-weight:700;
}
.logo span{color:var(--teal);}

.sub{color:var(--gray);margin-top:10px;}

/* login */
.container{padding:24px;}

.input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #1E2D42;
  background:var(--bg3);
  color:white;
  margin-bottom:12px;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:var(--teal);
  font-weight:700;
  color:#001A10;
}

/* cards */
.card{
  background:var(--bg3);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.stat{
  font-size:28px;
  font-weight:700;
  color:var(--teal);
}

/* mapa */
canvas{
  width:100%;
  height:180px;
  border-radius:14px;
  background:#0F1825;
}

/* botão fixo */
.fixed{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-width:430px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active center">
  <div class="logo">Fraud<span>Log</span></div>
  <div class="sub">Entregou. Protegido.</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="container">
    <div class="logo" style="font-size:20px;">Fraud<span>Log</span></div>

    <h2 style="margin:20px 0;">Seu escudo em cada entrega</h2>

    <input id="nome" class="input" placeholder="Seu nome">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="container">
    <div class="logo" style="font-size:14px;">Fraud<span>Log</span></div>

    <div style="margin-top:10px;">Bom dia</div>
    <h2 id="user"></h2>

    <div class="card">
      <div>Hoje</div>
      <div class="stat" id="count">0</div>
    </div>

    <button class="btn" onclick="novaEntrega()">Iniciar Nova Entrega</button>
  </div>
</div>

<!-- ENTREGA -->
<div id="entrega" class="screen">
  <div class="container">
    <h3>Entrega ativa</h3>

    <div class="card" id="status">
      Iniciando sensores...
    </div>

    <canvas id="map"></canvas>

    <div class="card" id="wpp">
      Aguardando confirmação da portaria...
    </div>
  </div>

  <button id="btn" class="btn fixed" disabled onclick="gerarCertificado()">
    Gerar Certificado
  </button>
</div>

<!-- CERTIFICADO -->
<div id="cert" class="screen">
  <div class="container">

    <div class="card" style="text-align:center;border:1px solid var(--teal);">
      <h3 style="color:var(--teal)">Entrega Certificada</h3>
      <small>Prova criptográfica gerada</small>
    </div>

    <div class="card">
      <small>Hash Final</small>
      <div id="hash" style="color:var(--teal);word-break:break-all;"></div>
    </div>

    <button class="btn" onclick="voltar()">Voltar</button>
  </div>
</div>

<script>

/* navegação */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* splash estável */
setTimeout(()=>{
  show('login');
},1200);

/* login */
function login(){
  let nome=document.getElementById('nome').value||"Entregador";
  document.getElementById('user').innerText=nome;
  show('home');
}

/* nova entrega */
function novaEntrega(){
  show('entrega');
  iniciarFluxo();
}

/* fluxo SEM dependência externa */
function iniciarFluxo(){

  let status = document.getElementById('status');
  let wpp = document.getElementById('wpp');

  status.innerText = "Capturando GPS...";
  desenharMapa();

  setTimeout(()=>{
    status.innerText = "GPS validado";
  },1000);

  setTimeout(()=>{
    status.innerText = "Câmera autenticada";
  },2000);

  setTimeout(()=>{
    wpp.innerText = "Portaria respondeu OK ✓";
  },2500);

  setTimeout(()=>{
    status.innerText = "Tudo validado";
    document.getElementById('btn').disabled=false;
  },3000);
}

/* mapa robusto */
function desenharMapa(){
  let c = document.getElementById('map');
  let ctx = c.getContext('2d');

  c.width = c.offsetWidth;
  c.height = 180;

  ctx.fillStyle="#0F1825";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle="#00C896";
  ctx.beginPath();
  ctx.arc(c.width/2,c.height/2,10,0,Math.PI*2);
  ctx.fill();
}

/* certificado */
function gerarCertificado(){
  let hash = "FL" + Math.random().toString(16).substring(2,34);

  document.getElementById('hash').innerText = hash;

  let c = document.getElementById('count');
  c.innerText = parseInt(c.innerText)+1;

  show('cert');
}

function voltar(){
  show('home');
}

</script>

</body>
</html>

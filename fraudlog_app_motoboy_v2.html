<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoShield - Protocolo de Entrega Segura</title>
    
    <meta property="og:title" content="MotoShield: Entrega Certificada">
    <meta property="og:description" content="Protocolo de segurança com GPS e Assinatura Digital para entregadores.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shieldBlue: {
                            DEFAULT: '#2563eb', // Azul profissional
                            dark: '#1d4ed8',
                        },
                        shieldBg: '#ffffff', // Fundo Branco
                        shieldText: '#1e293b', // Texto Cinza Escuro
                        shieldCard: '#f8fafc', // Fundo dos Cards
                    }
                }
            }
        }
    </script>

    <style>
        #map { height: 280px; z-index: 1; border-radius: 1.5rem; }
        
        /* Animação de Pulsação no GPS */
        .gps-pulse {
            width: 14px; height: 14px;
            background: #2563eb; border-radius: 50%;
            position: absolute; top: 0; right: 0;
            margin: -3px;
            box-shadow: 0 0 0 rgba(37, 99, 235, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Estilo da barra de rolagem (opcional para ficar mais "app") */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-[400px] mx-auto bg-shieldBg min-h-screen shadow-2xl flex flex-col border-x border-gray-200">
        
        <header class="bg-shieldBg p-6 pb-2 text-shieldText text-center border-b border-gray-100 sticky top-0 z-[1001]">
            <h1 class="text-xl font-bold tracking-tight">🛡️ MOTOSHIELD PROTOCOL</h1>
            <p class="text-xs text-gray-500">Certificação Georreferenciada de Entrega</p>
        </header>

        <main class="p-5 flex-grow space-y-7 overscroll-contain">
            
            <section class="text-center p-2">
                <p class="text-gray-500 text-sm">Olá, entregador</p>
                <h2 class="text-3xl font-black text-shieldText">João Silva</h2>
                <div class="inline-flex items-center gap-2 mt-2 px-3 py-1.5 bg-green-50 text-green-700 rounded-full text-xs font-semibold">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-600"></span>
                    </span>
                    App ativo — proteção ligada
                </div>
            </section>

            <section class="grid grid-cols-2 gap-4">
                <div class="bg-shieldCard p-5 rounded-2xl border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Entregas Hoje</p>
                    <p class="text-4xl font-black text-green-600 mt-1">14</p>
                </div>
                <div class="bg-shieldCard p-5 rounded-2xl border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Provas Geradas</p>
                    <p class="text-4xl font-black text-shieldBlue mt-1">112</p>
                </div>
            </section>

            <section class="bg-shieldCard p-6 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-inner">
                <div class="p-3 bg-red-100 text-red-600 text-3xl rounded-xl">🚫</div>
                <div>
                    <h3 class="text-xs text-gray-500 uppercase tracking-wider">Disputas Bloqueadas</h3>
                    <p class="text-2xl font-black text-shieldText mt-0.5">3 fraudes impedidas</p>
                    <p class="text-[11px] text-gray-500">com prova criptográfica irrefutável</p>
                </div>
            </section>

            <section class="sticky bottom-6 z-10 p-3">
                <button onclick="iniciarNovaEntrega()" id="btnIniciar" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg hover:bg-black active:scale-95 transition-all shadow-xl flex items-center justify-center gap-3">
                    <span class="text-2xl">⚡</span>
                    Iniciar Nova Entrega
                </button>
            </section>

        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        function iniciarNovaEntrega() {
            // No momento, apenas simula a transição para a tela de entrega
            alert('A transição para o mapa está sendo preparada. Abra no navegador para ver a simulação forense.');
        }

        // Correção para o "Script error" — Verifica se a biblioteca carregou
        window.addEventListener('load', function() {
            if (typeof L === 'undefined') {
                console.error("Erro: A biblioteca do mapa (Leaflet) não foi carregada. Verifique sua conexão ou se o CORS está bloqueando.");
                // Você pode adicionar um aviso visual aqui se o mapa for essencial
            } else {
                console.log("Leaflet carregado com sucesso.");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudLog — Entregador</title>

<style>
:root {
  --bg:#0A0F1E;
  --bg2:#111827;
  --bg3:#1A2235;
  --teal:#00C896;
  --gray:#8A9AB8;
  --white:#F0F6FF;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system, sans-serif;
  max-width:430px;
  margin:auto;
}

/* SCREENS */
.screen{display:none;height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* SPLASH */
#splash{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.logo{
  font-size:32px;
  font-weight:700;
}
.logo span{color:var(--teal);}

.sub{
  color:var(--gray);
  margin-top:10px;
}

/* LOGIN */
.login{padding:30px;}

.input{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #1E2D42;
  background:var(--bg3);
  color:white;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:var(--teal);
  font-weight:700;
}

/* HOME */
.card{
  background:var(--bg3);
  padding:16px;
  border-radius:14px;
  margin-bottom:10px;
}

/* ENTREGA */
canvas{
  width:100%;
  height:180px;
  background:#111;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <div class="logo">Fraud<span>Log</span></div>
  <div class="sub">Entregou. Protegido.</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="login">
    <h2>Seu escudo em cada entrega</h2>
    <input id="nome" class="input" placeholder="Seu nome">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="login">
    <h2 id="user"></h2>

    <div class="card">
      <small>Hoje</small>
      <h1 id="count">0</h1>
    </div>

    <button class="btn" onclick="novaEntrega()">Nova Entrega</button>
  </div>
</div>

<!-- ENTREGA -->
<div id="entrega" class="screen">
  <div class="login">
    <h3>Entrega ativa</h3>

    <div class="card" id="status">Iniciando...</div>

    <canvas id="map"></canvas>

    <button id="btn" class="btn" disabled onclick="certificar()" style="margin-top:20px;">
      Gerar Certificado
    </button>
  </div>
</div>

<!-- CERT -->
<div id="cert" class="screen">
  <div class="login">
    <h2>Entrega Certificada</h2>

    <div class="card">
      <small>Hash</small>
      <div id="hash" style="color:#00C896;"></div>
    </div>

    <button class="btn" onclick="home()">Voltar</button>
  </div>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* SPLASH (seguro) */
setTimeout(()=>{
  show('login');
},1200);

/* LOGIN */
function login(){
  let nome = document.getElementById('nome').value || "Entregador";
  document.getElementById('user').innerText = nome;
  show('home');
}

/* ENTREGA */
function novaEntrega(){
  show('entrega');
  iniciar();
}

function iniciar(){
  document.getElementById('status').innerText = "Capturando GPS...";

  /* GPS blindado */
  try{
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(pos){
          document.getElementById('status').innerText = "GPS OK";
          desenhar();
        },
        function(){
          fallback();
        },
        {timeout:3000}
      );
    }else{
      fallback();
    }
  }catch(e){
    fallback();
  }

  function fallback(){
    document.getElementById('status').innerText = "GPS simulado";
    desenhar();
  }

  setTimeout(()=>{
    document.getElementById('status').innerText = "WhatsApp OK";
  },2000);

  setTimeout(()=>{
    document.getElementById('status').innerText = "Tudo validado";
    document.getElementById('btn').disabled = false;
  },3000);
}

/* MAPA SEGURO */
function desenhar(){
  let c = document.getElementById('map');
  let ctx = c.getContext('2d');

  ctx.fillStyle="#0F1825";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle="#00C896";
  ctx.beginPath();
  ctx.arc(c.width/2,c.height/2,8,0,Math.PI*2);
  ctx.fill();
}

/* CERTIFICADO */
function certificar(){
  let hash = "FL" + Math.random().toString(16).slice(2);

  document.getElementById('hash').innerText = hash;

  let count = document.getElementById('count');
  count.innerText = parseInt(count.innerText)+1;

  show('cert');
}

function home(){
  show('home');
}

</script>

</body>
</html>

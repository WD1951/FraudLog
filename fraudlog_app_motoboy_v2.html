<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MotoShield - App do Motoboy</title>
    
    <meta property="og:title" content="MotoShield: Sua presença provada">
    <meta property="og:description" content="Protocolo de segurança com GPS e Assinatura Digital para entregadores.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script>
        // Configuração de cores personalizadas baseadas na Landing Page
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shieldBlue: {
                            DEFAULT: '#2563eb', // Azul profissional da Landing Page
                            dark: '#1d4ed8',
                        },
                        shieldBg: '#ffffff', // Fundo Branco
                        shieldText: '#1e293b', // Texto Cinza Escuro
                        shieldCard: '#f8fafc', // Fundo dos Cards
                    }
                }
            }
        }
    </script>

    <style>
        /* Ajuste do Mapa para não quebrar o layout mobile */
        #map { 
            height: 280px; 
            z-index: 1; 
            border-radius: 1.5rem; 
            border: 1px solid #e2e8f0; 
        }
        
        /* Animação de Pulsação no GPS (Estilo "ativo") */
        .gps-pulse {
            width: 14px; height: 14px;
            background: #2563eb; border-radius: 50%;
            box-shadow: 0 0 0 rgba(37, 99, 235, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Esconder barra de rolagem (opcional para ficar mais "app") */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-shieldText">

    <div class="max-w-[400px] mx-auto bg-shieldBg min-h-screen shadow-2xl flex flex-col border-x border-gray-200 overscroll-contain">
        
        <header class="bg-shieldBg p-6 pb-2 text-center border-b border-gray-100 sticky top-0 z-[1001]">
            <div class="flex flex-col items-center gap-2">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🛡️</span> <h1 class="text-2xl font-black tracking-tight text-slate-800">
                        Moto<span class="text-shieldBlue">Shield</span>
                    </h1>
                </div>
                <p class="text-xs text-gray-500 font-medium">PROTOCOLO DE ENTREGA SEGURA</p>
            </div>
        </header>

        <main class="p-5 flex-grow space-y-7">
            
            <section class="text-center p-2">
                <p class="text-gray-500 text-sm">Olá, entregador</p>
                <h2 class="text-3xl font-black text-slate-900">João Silva</h2>
                <div class="inline-flex items-center gap-2 mt-2 px-3 py-1.5 bg-green-50 text-green-700 rounded-full text-xs font-semibold">
                    <div class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-600"></span>
                    </div>
                    App ativo — proteção ligada
                </div>
            </section>

            <section class="grid grid-cols-2 gap-4">
                <div class="bg-shieldCard p-5 rounded-2xl border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Entregas Hoje</p>
                    <p class="text-4xl font-black text-green-600 mt-1">14</p>
                </div>
                <div class="bg-shieldCard p-5 rounded-2xl border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Provas Geradas</p>
                    <p class="text-4xl font-black text-shieldBlue mt-1">112</p>
                </div>
            </section>

            <section class="bg-shieldCard p-6 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-inner">
                <div class="p-3 bg-red-100 text-red-600 text-3xl rounded-xl">🚫</div>
                <div>
                    <h3 class="text-xs text-gray-500 uppercase tracking-wider">Disputas Bloqueadas</h3>
                    <p class="text-2xl font-black text-slate-900 mt-0.5">3 fraudes impedidas</p>
                    <p class="text-[11px] text-gray-500">com prova criptográfica irrefutável</p>
                </div>
            </section>

            <section class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest italic">Localização em Tempo Real</h2>
                    <div class="gps-pulse"></div>
                </div>
                <div id="map" class="shadow-md"></div>
                <p class="text-[10px] text-center text-gray-400">Coordenadas capturadas via satélite (WGS84)</p>
            </section>

            <section class="sticky bottom-6 z-10 p-3 bg-shieldBg/95 backdrop-blur-sm rounded-t-xl">
                <button onclick="iniciarNovaEntrega()" id="btnIniciar" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg hover:bg-black active:scale-95 transition-all shadow-xl flex items-center justify-center gap-3">
                    <span class="text-2xl">⚡</span>
                    Iniciar Nova Entrega
                </button>
            </section>

        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa (Foco na Av. Paulista, SP como padrão)
        const lat = -23.5615, lon = -46.6553;
        const map = L.map('map', {
            zoomControl: false, // Mobile prefere sem botões de zoom
            attributionControl: false // Limpar o visual
        }).setView([lat, lon], 16);
        
        // Adiciona a camada do mapa (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Adiciona o marcador simulando o motoboy parado
        L.marker([lat, lon]).addTo(map).bindPopup("Você está aqui").openPopup();

        // Lógica de simulação
        function iniciarNovaEntrega() {
            alert('A transição para o mapa está sendo preparada. Abra no navegador do computador para ver a simulação forense.');
        }

        // Verificação extra para o "Script error" no Xiaomi — Avisa se não carregar
        window.addEventListener('load', function() {
            if (typeof L === 'undefined') {
                console.error("Erro: A biblioteca do mapa (Leaflet) não foi carregada. Verifique sua conexão ou se o CORS está bloqueando.");
            } else {
                console.log("Leaflet carregado com sucesso.");
            }
        });
    </script>
</body>
</html>
